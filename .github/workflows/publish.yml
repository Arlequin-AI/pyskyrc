name: publish

on:
  release:
    types: [published]

jobs:
  pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write       # Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install build
        run: pip install build

      - name: build
        run: python -m build

      - name: publish
        uses: pypa/gh-action-pypi-publish@release/v1
